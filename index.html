<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KYC Verification — beyound</title>
  <meta name="description" content="Complete your KYC verification for the beyound platform. Powered by HyperVerge.">
  <meta name="theme-color" content="#059669">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:title" content="KYC Verification — beyound">
  <meta property="og:description" content="Complete your KYC verification for the beyound platform.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kyc.beyound.in">
  <link rel="canonical" href="https://kyc.beyound.in/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23059669'/><text x='50' y='68' text-anchor='middle' font-size='52' font-weight='700' font-family='system-ui' fill='white'>b</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://hv-web-sdk-cdn.hyperverge.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- HyperVerge Web SDK. Pinned to v10.10.2 to match the version the
       Zokudo + CSB reference integration is verified against. @latest
       resolves to a much older build that can't parse the modern
       workflow config. -->
  <script src="https://hv-web-sdk-cdn.hyperverge.co/hyperverge-web-sdk@10.10.2/src/sdk.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; display: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }

    :root {
      --brand: #059669;
      --brand-dark: #047857;
      --brand-glow: rgba(5, 150, 105, 0.18);
      --ink: #0F172A;
      --ink-soft: #1F2937;
      --muted: #475569;
      --line: #E2E8F0;
      --bg: #ffffff;
      --bg-soft: #F8FAFC;
      --success: #059669;
      --warning: #D97706;
      --danger: #DC2626;
    }

    body {
      font-family: 'Sora', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Bare launcher: nothing but a centered loader + (on failure) a
       status card and a retry button. The HyperVerge SDK overlay takes
       over the whole screen once it mounts, so this page is just the
       boot/loading/error shell behind it. */
    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .loader[hidden] { display: none; }

    .spinner-lg {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(5, 150, 105, 0.15);
      border-top-color: var(--brand);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .boot-text {
      font-size: 15px;
      color: var(--muted);
      font-weight: 500;
    }

    .status {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      font-size: 14px;
      color: var(--ink-soft);
      display: none;
      text-align: left;
    }
    .status.show { display: block; }
    .status.success { border-color: var(--success); background: rgba(5, 150, 105, 0.06); color: #065F46; }
    .status.warning { border-color: var(--warning); background: rgba(217, 119, 6, 0.06); color: #92400E; }
    .status.danger  { border-color: var(--danger);  background: rgba(220, 38, 38, 0.06);  color: #991B1B; }
    .status .title { font-weight: 600; margin-bottom: 4px; }
    .status .detail { font-size: 13px; color: inherit; opacity: 0.85; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 28px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
    }
    .btn[hidden] { display: none; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      box-shadow: 0 8px 24px var(--brand-glow);
    }
    .btn-primary:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px var(--brand-glow);
    }
  </style>
</head>
<body>
  <main>
    <div class="loader" id="loader">
      <span class="spinner-lg" aria-hidden="true"></span>
      <p class="boot-text" id="bootText">Starting secure verification…</p>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <!-- Retry only surfaces if the auto-launch fails (SDK didn't load,
         token/network error, HV reject). Hidden on the happy path. -->
    <button id="launch" class="btn btn-primary" type="button" hidden>
      <span class="label">Start KYC verification</span>
    </button>
  </main>

  <script>
    // ────────────────────────────────────────────────────────────────────────
    // Config
    // ────────────────────────────────────────────────────────────────────────
    //
    // The KYC SDK needs a short-lived JWT minted by the backend. We expose
    // the endpoint as a constant so the page can also be self-served via a
    // CDN without touching the markup. Override at runtime by setting
    // `window.BEYOUND_KYC_TOKEN_ENDPOINT` BEFORE this script runs.
    //
    // The endpoint must return JSON of the shape:
    //   { "token": "<jwt>", "transactionId": "<id>" }
    // or, for the older 4-arg HyperKycConfig shape:
    //   { "accessToken": "...", "workflowId": "...", "transactionId": "..." }
    //
    // The backend route is responsible for calling HyperVerge's token mint
    // API with the workspace's accessKey + appId. Do NOT expose those
    // credentials in this page.

    const CONFIG = {
      // Zokudo wallet endpoints. The flow is two server calls:
      //   1. register            — ensure the merchant's wallet exists/active
      //   2. generate-kyc-request — mint the HyperVerge SDK token (workflow +
      //                             transaction IDs stamped into the JWT)
      // generate-kyc-request 404s (WALLET_NOT_FOUND) unless register ran
      // first, so the page calls register then generate on every launch.
      // Both take { merchantId } in the body. Override either at runtime
      // with window.BEYOUND_KYC_REGISTER_ENDPOINT / BEYOUND_KYC_TOKEN_ENDPOINT.
      registerEndpoint:
        window.BEYOUND_KYC_REGISTER_ENDPOINT ||
        "https://su-api-v2.asdfay.com/api/v1/zokudo/wallet/register",
      tokenEndpoint:
        window.BEYOUND_KYC_TOKEN_ENDPOINT ||
        "https://su-api-v2.asdfay.com/api/v1/zokudo/wallet/generate-kyc-request",
      // appId + workflowId are public-safe identifiers. The page uses
      // them to call HyperKYCModule.prefetch() on first paint, which
      // warm-loads the workflow config + assets so the actual launch
      // doesn't sit on a "loading…" spinner. Override at runtime by
      // setting `window.BEYOUND_KYC_APP_ID` / `window.BEYOUND_KYC_WORKFLOW_ID`.
      // appId is decoded from the JWT payload at launch time (the
      // backend's response also carries `app_id` directly in newer
      // builds). These hardcoded fallbacks are only used by the page-
      // boot prefetch when no JWT is in scope yet.
      appId: window.BEYOUND_KYC_APP_ID || "cceyez",
      workflowId: window.BEYOUND_KYC_WORKFLOW_ID || "zokudo_kyc_revamp",
      brandColor: "#059669",
      // Show HyperVerge's intro screen before capture. The CSB
      // reference integration runs with this on; keeping it lets the
      // SDK surface permission prompts and instructions in its own
      // flow rather than racing the user out the gate. It also supplies
      // the user gesture for camera access on the auto-launch path.
      showHyperVergeLanding: true,
      defaultLanguage: "en",
      supportDarkMode: false,
      // Inputs the workflow's `inputsRequired` array expects. Leave as
      // null / {} when the workflow has no required inputs. Backend can
      // also return these on the token endpoint under `inputs`.
      inputs: null,
    };

    // HyperVerge error code -> human-readable bucket. Mirrors the
    // "Summary" column in the Mar-2026 integration guide.
    const ERROR_CODE_BUCKETS = {
      101: "SDK config error",
      102: "Workflow input error",
      103: "Network or user-cancel",
      104: "Workflow error",
      106: "Camera permission denied",
      107: "Camera / recorder hardware error",
      111: "Upstream API error",
      112: "Signature validation failed",
      126: "Privacy consent denied",
      151: "Session conflict",
    };

    // ────────────────────────────────────────────────────────────────────────
    // UI helpers
    // ────────────────────────────────────────────────────────────────────────

    const launchBtn = document.getElementById("launch");
    const statusEl = document.getElementById("status");
    const loaderEl = document.getElementById("loader");
    const bootTextEl = document.getElementById("bootText");
    const btnLabel = launchBtn.querySelector(".label");

    const STATUS_VARIANTS = {
      info: "",
      success: "success",
      warning: "warning",
      danger: "danger",
    };

    function setStatus(variant, title, detail) {
      statusEl.className = "status show " + (STATUS_VARIANTS[variant] || "");
      statusEl.innerHTML =
        '<div class="title">' + escapeHtml(title) + '</div>' +
        (detail ? '<div class="detail">' + escapeHtml(detail) + '</div>' : '');
    }

    function clearStatus() {
      statusEl.className = "status";
      statusEl.innerHTML = "";
    }

    // While a launch attempt is running we show the spinner and hide the
    // retry button. When it settles (failure path), the caller reveals the
    // retry button so the user isn't stranded on a bare page.
    function setLoading(loading) {
      launchBtn.disabled = loading;
      btnLabel.textContent = loading
        ? "Starting verification…"
        : "Start KYC verification";
      if (loading) {
        loaderEl.hidden = false;
        launchBtn.hidden = true;
      }
    }

    function showRetry(message) {
      loaderEl.hidden = true;
      launchBtn.hidden = false;
      if (message) bootTextEl.textContent = message;
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[c]));
    }

    // ────────────────────────────────────────────────────────────────────────
    // Post-KYC redirect — bounce the user back to the upstream app once the
    // HyperVerge SDK has finished. The wallet caller can override the
    // landing URL via ?return_url=... (or ?next=...); otherwise we send the
    // user to wallet.beyound.in. Only https://*.beyound.in destinations are
    // accepted to keep this from doubling as an open redirect.
    // ────────────────────────────────────────────────────────────────────────
    const DEFAULT_RETURN_URL = "https://wallet.beyound.in/";

    function readReturnUrl() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get("return_url") || params.get("next") || "";
      if (!raw) return DEFAULT_RETURN_URL;
      try {
        const u = new URL(raw, window.location.origin);
        const okProtocol = u.protocol === "https:";
        const okHost =
          u.hostname === "beyound.in" || u.hostname.endsWith(".beyound.in");
        if (okProtocol && okHost) return u.toString();
      } catch (_) {
        // fall through to default
      }
      return DEFAULT_RETURN_URL;
    }

    function buildReturnUrlWithResult(result) {
      const base = readReturnUrl();
      let u;
      try {
        u = new URL(base);
      } catch (_) {
        return DEFAULT_RETURN_URL;
      }
      if (result && result.status) u.searchParams.set("kyc_status", result.status);
      if (result && result.code) u.searchParams.set("kyc_code", result.code);
      return u.toString();
    }

    // How long the status stays visible before we redirect, keyed by the
    // describeResult().variant value. Successes redirect fast so the user
    // doesn't feel stuck; failures linger so the message can be read.
    const REDIRECT_DELAY_MS = {
      success: 1500,
      warning: 2500,
      danger: 4000,
      info: 2000,
    };

    var isEmbedded = (function () {
      try { return window.parent && window.parent !== window; }
      catch (_) { return false; }
    })();

    function scheduleRedirect(variant, result) {
      // When embedded in the wallet's KYC webview (iframe), don't
      // navigate — postMessage the SDK result to the parent so the
      // wallet can close the webview + show success / KYC-failed. The
      // parent only trusts messages from *.beyound.in.
      if (isEmbedded) {
        try {
          window.parent.postMessage({
            type: "beyound-kyc-result",
            status: (result && result.status) || "error",
            code: (result && result.code) || null,
          }, "*");
        } catch (_) {}
        return;
      }
      const target = buildReturnUrlWithResult(result);
      const delay = REDIRECT_DELAY_MS[variant] != null
        ? REDIRECT_DELAY_MS[variant]
        : 2500;
      window.setTimeout(() => {
        window.location.replace(target);
      }, delay);
    }

    // ────────────────────────────────────────────────────────────────────────
    // Token fetch
    // ────────────────────────────────────────────────────────────────────────

    // Session forwarded by the upstream app (wallet / bills) when it
    // links to KYC via query params: kyc.beyound.in/?sid=...&mid=...
    //
    // We fetch with credentials:"omit" — the wallet API is cross-origin
    // and serves a wildcard Access-Control-Allow-Origin, which the
    // browser refuses to pair with cookies. Auth travels purely as the
    // merchantId in the request body; no cookies, no custom headers, so
    // there's nothing for a CORS preflight to reject.
    function readSessionFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return {
        sessionId: params.get("sid") || params.get("session-id") || params.get("sessionId") || "",
        merchantId: params.get("mid") || params.get("merchant-id") || params.get("merchantId") || "",
      };
    }

    function stripBearerPrefix(raw) {
      if (!raw) return raw;
      return String(raw).replace(/^bearer\s+/i, "");
    }

    function decodeJwtPayload(jwt) {
      // Best-effort base64url decode of the middle segment. Returns
      // null on any failure so callers can fall back to defaults.
      try {
        var bare = String(jwt || "").replace(/^bearer\s+/i, "");
        var parts = bare.split(".");
        if (parts.length < 2) return null;
        var b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        var json = decodeURIComponent(
          atob(b64)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join("")
        );
        return JSON.parse(json);
      } catch (_e) {
        return null;
      }
    }

    function readPrebakedTokenFromUrl() {
      // UAT escape hatch: if the URL carries ?token=<jwt>&workflow_id=...
      // &transaction_id=... (e.g. from a manual mint by the backend
      // operator), use those directly and skip the CORS-bound backend
      // call. Used to demo / hand-test the SDK while the dev backend's
      // CORS allowlist for kyc.beyound.in is still being added.
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || params.get("access_token");
      if (!token) return null;
      return {
        token: stripBearerPrefix(token),
        workflowId:
          params.get("workflow_id") ||
          params.get("workflowId") ||
          null,
        transactionId:
          params.get("transaction_id") ||
          params.get("transactionId") ||
          null,
        kycRecordId: params.get("kyc_record_id") || null,
        inputs: null,
      };
    }

    // Headers for the wallet API. The su-api-v2 gateway authorizes zokudo
    // calls by the session-id + merchant-id headers (same as the rally
    // app's callApi), so we forward whatever the wallet handed us on the
    // URL (?sid=&mid=). Without them the gateway returns 403. The body
    // also carries merchantId. (These custom headers make it a preflighted
    // CORS request — the gateway's allow-headers list covers them.)
    function authHeaders() {
      const { sessionId, merchantId } = readSessionFromUrl();
      const h = {
        "Content-Type": "application/json",
        accept: "application/json",
      };
      if (sessionId) h["session-id"] = sessionId;
      if (merchantId) h["merchant-id"] = merchantId;
      return h;
    }

    // Pull a human-readable message out of whatever error envelope the
    // wallet API returned. Handles { detail: { message } }, { detail },
    // { error: { message } }, and { message } shapes.
    async function extractApiError(res, fallbackLabel, endpoint) {
      let detail = "";
      try {
        const body = await res.json();
        detail =
          (body && body.error && body.error.message) ||
          (body && body.detail && body.detail.message) ||
          (body && typeof body.detail === "string" ? body.detail : "") ||
          (body && body.message) ||
          "";
      } catch (_) {}
      return new Error(
        (detail || fallbackLabel + " returned " + res.status) +
          " (" + endpoint + ")"
      );
    }

    // Step 1 — ensure the merchant's Zokudo wallet exists and is active.
    // generate-kyc-request 404s (WALLET_NOT_FOUND) without this. On an
    // already-active wallet the backend returns 200 (already-active
    // branch), so calling this every launch is safe + idempotent.
    async function registerWallet(merchantId) {
      const res = await fetch(CONFIG.registerEndpoint, {
        method: "POST",
        credentials: "omit",
        headers: authHeaders(),
        body: JSON.stringify({ merchantId }),
      });
      if (!res.ok) {
        throw await extractApiError(res, "Register", CONFIG.registerEndpoint);
      }
      return res.json().catch(() => ({}));
    }

    async function fetchKycToken() {
      const prebaked = readPrebakedTokenFromUrl();
      if (prebaked) return prebaked;
      const { merchantId } = readSessionFromUrl();
      if (!merchantId) {
        throw new Error(
          "Missing merchant context. Open this page from the beyound wallet so a session can be forwarded."
        );
      }
      // 1. Register / ensure an active wallet for this merchant.
      await registerWallet(merchantId);
      // 2. Generate the KYC request -> HyperVerge SDK tokens.
      const res = await fetch(CONFIG.tokenEndpoint, {
        method: "POST",
        credentials: "omit",
        headers: authHeaders(),
        body: JSON.stringify({ merchantId }),
      });
      if (!res.ok) {
        throw await extractApiError(res, "Token endpoint", CONFIG.tokenEndpoint);
      }
      const body = await res.json();
      // Zokudo wrapper response shape:
      //   { success, message, access_token, workflow_id, transaction_id, kyc_record_id }
      // The access_token comes prefixed with "Bearer " — strip it before
      // handing to HyperKycConfig. Also accept the older camelCase /
      // bare-token shapes for compatibility with any legacy backend.
      const rawToken =
        body.access_token || body.accessToken || body.token;
      const token = stripBearerPrefix(rawToken);
      if (!token) {
        throw new Error(
          "Token endpoint returned no `access_token` / `token` field"
        );
      }
      return {
        token,
        workflowId: body.workflow_id || body.workflowId || null,
        transactionId: body.transaction_id || body.transactionId || null,
        kycRecordId: body.kyc_record_id || null,
        inputs: body.inputs || null,
      };
    }

    // ────────────────────────────────────────────────────────────────────────
    // SDK launch
    // ────────────────────────────────────────────────────────────────────────

    function ensureSdkAvailable() {
      if (typeof HyperKycConfig === "undefined" || typeof HyperKYCModule === "undefined") {
        throw new Error(
          "HyperVerge SDK failed to load — check network, ad-blockers, and CSP."
        );
      }
    }

    function tryPrefetch() {
      // Per the integration guide: "Call prefetch() WELL BEFORE launch(),
      // not right before it. Calling it immediately before launch() can
      // leave the workflow stuck in a loading state." So fire it on
      // page boot when we have both ids configured.
      if (!CONFIG.appId || !CONFIG.workflowId) return;
      if (typeof HyperKYCModule === "undefined") return;
      if (typeof HyperKYCModule.prefetch !== "function") return;
      try {
        HyperKYCModule.prefetch(CONFIG.appId, CONFIG.workflowId);
        if (window.console) {
          console.log(
            "[hv-kyc] prefetch fired",
            { appId: CONFIG.appId, workflowId: CONFIG.workflowId }
          );
        }
      } catch (e) {
        console.warn("[hv-kyc] prefetch failed", e);
      }
    }

    function buildKycConfig({ token, workflowId, transactionId, inputs }) {
      // Mirror the verified Zokudo + CSB reference integration:
      //   1. Strip any "Bearer " prefix that the backend returned.
      //   2. Re-prepend "Bearer " ourselves so the access token
      //      handed to HyperKycConfig is always the same shape.
      //   3. 4-arg positional: (accessToken, workflowId, transactionId,
      //      showLandingPage = true).
      var bare = stripBearerPrefix(token);
      var cfg = new HyperKycConfig(
        "Bearer " + bare,
        workflowId,
        transactionId,
        CONFIG.showHyperVergeLanding
      );
      cfg.__beyoundTrace = { workflowId, transactionId };
      if (typeof cfg.supportDarkMode === "function") {
        cfg.supportDarkMode(!!CONFIG.supportDarkMode);
      }
      if (typeof cfg.setDefaultLangCode === "function") {
        cfg.setDefaultLangCode(CONFIG.defaultLanguage);
      }
      if (typeof cfg.setInitialLoaderColor === "function") {
        cfg.setInitialLoaderColor(CONFIG.brandColor);
      }
      // Location is opt-in. Most KYC workflows do not require it and
      // requesting unnecessarily is a friction point we avoid.
      if (typeof cfg.setUseLocation === "function") {
        cfg.setUseLocation(false);
      }
      // Some workflows declare an `inputsRequired` array. The SDK
      // throws error 102 if any required key is missing, so forward
      // whatever the backend handed us (and the static CONFIG.inputs
      // fallback) before launch.
      const mergedInputs = Object.assign({}, CONFIG.inputs || {}, inputs || {});
      if (Object.keys(mergedInputs).length && typeof cfg.setInputs === "function") {
        cfg.setInputs(mergedInputs);
      }
      return cfg;
    }

    function describeResult(result) {
      // Result fields per HyperVerge docs: { status, code, message, ... }
      const code = result && result.code;
      const bucket = ERROR_CODE_BUCKETS[code];
      const codeSuffix = bucket ? " (" + bucket + ")" : "";
      switch (result && result.status) {
        case "auto_approved":
          return {
            variant: "success",
            title: "Verification complete",
            detail: "Your KYC has been auto-approved.",
          };
        case "auto_declined":
          return {
            variant: "danger",
            title: "Verification declined",
            detail:
              (result.message ||
                "Your documents could not be verified. Please contact support.") +
              codeSuffix,
          };
        case "needs_review":
          return {
            variant: "warning",
            title: "Submitted for review",
            detail:
              "Your documents are queued for manual review. We'll email you when it's done.",
          };
        case "user_cancelled":
          return {
            variant: "warning",
            title: "Verification cancelled",
            detail: "You closed the flow before completion. You can restart any time.",
          };
        case "error":
          return {
            variant: "danger",
            title: "Verification couldn't start",
            detail:
              (result.message ||
                "A technical error occurred. Please retry in a moment.") +
              codeSuffix,
          };
        default:
          return {
            variant: "warning",
            title: "Verification ended",
            detail:
              "status=" +
              (result && result.status) +
              " code=" +
              (result && result.code) +
              " message=" +
              (result && result.message),
          };
      }
    }

    // ────────────────────────────────────────────────────────────────────────
    // runKyc — the whole launch sequence. Fired automatically on page boot
    // (see bootLauncher below) and again if the user taps the retry button
    // after a failure. Guarded so it can never run two attempts at once.
    // ────────────────────────────────────────────────────────────────────────
    let kycRunning = false;

    async function runKyc() {
      if (kycRunning) return;
      kycRunning = true;
      clearStatus();
      setLoading(true);
      try {
        ensureSdkAvailable();
        const tokenPayload = await fetchKycToken();
        // prefetch already fired at boot (well before launch, per the
        // HyperVerge guide). The token fetch above also gives the
        // prefetched workflow time to warm before we launch.
        const cfg = buildKycConfig(tokenPayload);
        // HyperKYCModule.launch invokes the handler with the result —
        // its own promise can resolve with undefined depending on the
        // SDK build. So we capture the result from the callback and
        // wait on a promise that the handler resolves.
        let resolveResult;
        const resultPromise = new Promise((r) => {
          resolveResult = r;
        });
        const handler = (cbResult) => {
          console.log("[hv-kyc] callback", cbResult);
          resolveResult(cbResult);
        };
        const launchReturn = HyperKYCModule.launch(cfg, handler);
        // Watchdog: if the SDK doesn't mount UI within ~15s, surface a
        // clear "stuck before launch" error. The typical cause is an
        // HV-side domain whitelist miss (cceyez / zokudo_kyc_revamp →
        // Allowed Domains in the HV One dashboard).
        const watchdog = new Promise((_, reject) => {
          setTimeout(() => {
            // v8.11.5 mounts the SDK as a top-level <div id="HV_*"> on
            // body (not an iframe), so check for any of those plus the
            // legacy iframe selectors. Only reject if none have shown.
            const sdkRoot = document.querySelector(
              "iframe[src*='hyperverge'], iframe[src*='hv-web-sdk'], [id^='HV_'], [class*='hv-modal']"
            );
            if (!sdkRoot) {
              reject(
                new Error(
                  "SDK didn't open its UI within 15s — likely an HV side reject. Check console for errors."
                )
              );
            }
          }, 15000);
        });
        // Belt-and-braces: if the SDK happens to resolve its own
        // promise with the result (newer builds do), use whichever
        // resolves first.
        const result = await Promise.race([
          resultPromise,
          Promise.resolve(launchReturn).then((r) => r ?? resultPromise),
          watchdog,
        ]);
        const summary = describeResult(result);
        setStatus(summary.variant, summary.title, summary.detail);
        loaderEl.hidden = true;
        // The HyperVerge SDK has handed control back — the user's run is
        // over (whether approved, declined, queued for review, cancelled,
        // or errored). Bounce them to the wallet so they aren't stranded
        // on kyc.beyound.in. The wallet listens for ?kyc_status= on its
        // landing route to surface a matching toast / refresh wallet state.
        scheduleRedirect(summary.variant, result);
      } catch (err) {
        console.error("[hv-kyc] launch failed", err);
        const msg = (err && err.message) || String(err);
        loaderEl.hidden = true;
        // "Already FULL KYC" is not a failure — the user has already
        // finished KYC on a previous run / via another channel. Zokudo
        // refuses to mint a fresh HyperVerge token because the customer
        // is already in the FULL_KYC state, so we never get into the
        // SDK. Surface this as a success: tell the user they're done,
        // then bounce back to the wallet with kyc_status=already_completed
        // so it can refresh its local KYC flag without re-prompting.
        //
        // Matched patterns (case-insensitive):
        //   - "Customer is already FULL KYC"      (Zokudo verbatim)
        //   - "already <anything> KYC"             (defensive)
        //   - "KYC already <verb>"                 (other phrasings)
        //   - "FULL KYC"                           (last resort)
        if (
          /already\s+.*\bKYC\b/i.test(msg) ||
          /\bKYC\b\s+already\b/i.test(msg) ||
          /\bFULL\s+KYC\b/i.test(msg)
        ) {
          setStatus(
            "success",
            "KYC already complete",
            "Your KYC is already verified — no action needed. Taking you back to your wallet."
          );
          scheduleRedirect("success", {
            status: "already_completed",
            code: "already_full_kyc",
          });
        } else {
          setStatus(
            "danger",
            "Could not start verification",
            msg
          );
          // Reveal the retry button so the user can re-attempt without a
          // page reload, then also bounce back to the wallet so they can
          // retry from the dashboard. Pass kyc_status=error so the wallet
          // can choose to re-open the KYC sheet rather than mark KYC done.
          showRetry();
          scheduleRedirect("danger", {
            status: "error",
            code: (err && err.code) || "launch_failed",
          });
        }
      } finally {
        setLoading(false);
        kycRunning = false;
      }
    }

    // Retry button (hidden until a failure surfaces it).
    launchBtn.addEventListener("click", runKyc);

    // ────────────────────────────────────────────────────────────────────────
    // Boot — strip-to-nothing launcher. As soon as the SDK script is ready
    // we (1) fire prefetch to warm the workflow assets, then (2) auto-run
    // the KYC flow. There is no "Start KYC" gate any more — the page opens
    // straight into HyperVerge. The SDK's own landing screen
    // (showHyperVergeLanding=true) provides the user gesture for camera
    // access. We poll briefly for the CDN <script> to define the SDK.
    // ────────────────────────────────────────────────────────────────────────
    (function bootLauncher() {
      var tries = 0;
      (function attempt() {
        var ready =
          typeof HyperKYCModule !== "undefined" &&
          typeof HyperKycConfig !== "undefined";
        if (ready) {
          tryPrefetch();
          // Give the prefetch a beat to register before launch, then go.
          // The token fetch inside runKyc() adds further separation, which
          // keeps the workflow from getting stuck in a loading state.
          setTimeout(runKyc, 250);
          return;
        }
        if (tries++ < 40) {
          setTimeout(attempt, 150); // up to ~6s
          return;
        }
        // SDK never loaded — show an error + retry affordance instead of a
        // spinner that hangs forever.
        loaderEl.hidden = true;
        setStatus(
          "danger",
          "Could not start verification",
          "The verification module failed to load. Check your connection and try again."
        );
        showRetry();
      })();
    })();
  </script>
</body>
</html>
